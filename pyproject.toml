[project]
name = "cbi-oneshot"
version = "0.1.0"
description = "One-shot Composite Burn Index for a single MTBS perimeter (Parks et al. 2019)."
requires-python = ">=3.12"
dependencies = [
    "geopandas",
    "rioxarray",
    "rasterio",
    "affine",
    "pyproj",
    "shapely",
    "pyogrio",
    "xarray",
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "pystac-client",
    "planetary-computer",
    "requests",
    "h5netcdf",
    "h5py",
]
